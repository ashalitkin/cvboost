# Who this system works for. EXAMPLE profile ("Jordan Example", fictional): run `/setup` in
# Claude Code to replace it with yours. Free text about the person is in config/prompts/*.md;
# facts about the person (the only fact base for CVs and letters) are in config/resume/profile.md.
name: Jordan Example
first_name: Jordan
pronouns: they          # he | she | they
photo: photo.jpg        # file in config/resume/ (`cvboost init` makes a grey placeholder; use your own square photo)
timezone: UTC           # your IANA time zone, e.g. Europe/Berlin
prompts_dir: prompts    # relative to this file
ui_language: en          # the interface language (English only for now)
explain_language: en     # language of the LLM's job summaries and fit notes: en ru uk pt es de fr it nl pl
documents_language: en   # CVs and cover letters (English only for now)
crm:
  client_label: Client of Example Consulting
# Data for the CV checker (cv/validate.py): a sentence naming a case may only use tools found on
# that case's lines of profile.md; no_tool_cases name no tool at all; extra_tools = tools beyond
# the Skills inventory. `sentence` / `profile_lines` are case-insensitive regexes.
cv:
  cases:
    - {sentence: 'acme', profile_lines: 'acme|meal-kit subscription', section: 'Analytics Solutions Architect, Acme Subscriptions'}
    - {sentence: 'meal-?kit', profile_lines: 'acme|meal-kit subscription'}
    - {sentence: 'fintech|mortgage|\blender\b', profile_lines: 'fintech'}
    - {sentence: 'logistics', profile_lines: 'logistics'}
    - {sentence: 'agenc(y|ies)', profile_lines: 'agency'}
    - {sentence: 'bike', profile_lines: 'bike-sharing'}
  no_tool_cases: ['real[- ]estate']
  extra_tools: [Salesforce, Postgres]
