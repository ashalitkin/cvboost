[project]
name = "cvboost"
version = "0.1.0"
description = "Personal lead-generation system: job collection, scoring, drafts"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "defusedxml>=0.7",
    "selectolax>=0.3",
    "pyyaml>=6",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "nh3>=0.3.7",
    "python-multipart>=0.0.33",
    "weasyprint>=70.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "dnspython>=2.9.2",
]

[project.scripts]
cvboost = "cvboost.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-socket>=0.7", "ruff>=0.6"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvboost"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
markers = ["publish: builds the public export (slow); runs only with CVBOOST_TEST_PUBLISH=1"]

[tool.ruff]
line-length = 100
extend-exclude = [".claude", "docs"]
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
