<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"historyCacheSize":0}'>
<title>{% block title %}cvboost{% endblock %} · cvboost</title>
<link rel="stylesheet" href="/static/app.css">
{% block head_extra %}{% endblock %}
<script src="/static/htmx.min.js"></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
<header class="top">
  <a class="brand" href="/inbox">cvboost</a>
  <nav>
    {% for key, href, label in nav %}<a href="{{ href }}"{% if key == active %} aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
